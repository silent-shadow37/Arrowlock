<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arrow Escape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>Arrow Escape</h1>
    <div class="stats">
      <span>Level: <b id="levelText">1</b>/500</span>
      <span>Coins: <b id="coinsText">0</b></span>
      <span>Best: <b id="bestText">—</b></span>
    </div>
  </header>

  <main class="container">

    <section class="menu-card" id="menuScreen">
      <h2>Escape Every Arrow</h2>
      <p>Clear every arrow from the board.</p>
      <button id="playButton">Play</button>
      <button id="levelsButton" class="secondary">Levels</button>
      <button id="shopButton" class="secondary">Shop</button>
      <button id="dailyButton" class="secondary">Daily Reward</button>
    </section>

    <section id="levelScreen" class="hidden">
      <div class="level-header">
        <button id="backButton" class="small-btn">Back</button>
        <h2>Select Level</h2>
      </div>
      <div id="levelGrid" class="level-grid"></div>
    </section>

    <section id="gameScreen" class="hidden">

      <div class="game-info">
        <div>
          <span>Level</span>
          <strong id="gameLevel">1</strong>
        </div>

        <div>
          <span>Moves</span>
          <strong id="movesText">0</strong>
        </div>

        <div>
          <span>Hearts</span>
          <strong id="heartsText">♥♥♥</strong>
        </div>

        <div>
          <span>Stars</span>
          <strong id="starsText">☆☆☆</strong>
        </div>
      </div>

      <div id="messageText" class="message"></div>

      <div id="board" class="board"></div>

      <div class="action-row">
        <button id="hintButton">Hint</button>
        <button id="undoButton">Undo</button>
        <button id="restartButton">Restart</button>
        <button id="pauseButton">Pause</button>
      </div>

    </section>

    <section id="shopScreen" class="hidden">
      <div class="level-header">
        <button id="shopBackButton" class="small-btn">Back</button>
        <h2>Shop</h2>
      </div>

      <div class="shop-card">
        <h3>Hint</h3>
        <p>Reveal a safe move.</p>
        <button id="buyHintButton">Buy — 20 Coins</button>
      </div>

      <div class="shop-card">
        <h3>Undo</h3>
        <p>Undo your last move.</p>
        <button id="buyUndoButton">Buy — 30 Coins</button>
      </div>

      <div class="shop-card">
        <h3>Heart Pack</h3>
        <p>Restore one heart.</p>
        <button id="buyHeartButton">Buy — 25 Coins</button>
      </div>
    </section>

  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="modalTitle">Paused</h2>
      <p id="modalMessage"></p>

      <button id="modalPrimary">Continue</button>
      <button id="modalSecondary" class="secondary">Restart</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
    </html>
